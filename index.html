<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <title>Huevos Farm</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ব্যালেন্স -->
    <div class="balance-card">
      <h2>🥚 EGGS Balance</h2>
      <div id="balance">0</div>
    </div>

    <!-- রেফার লিংক -->
    <div class="section">
      <h3>🔗 Your Refer Link</h3>
      <input id="referLink" readonly>
      <button onclick="copyRefer()">Copy</button>
    </div>

    <!-- টাস্ক -->
    <div class="section">
      <h3>✅ Daily Tasks</h3>
      <div id="tasks"></div>
    </div>

    <!-- লিডারবোর্ড -->
    <div class="section">
      <h3>🏆 Leaderboard</h3>
      <div id="leaderboard"></div>
    </div>

    <!-- উইথড্র -->
    <div class="section">
      <h3>💸 Withdraw (TON)</h3>
      <input type="number" id="withdrawAmount" placeholder="Amount in EGGS">
      <button id="withdrawBtn">Withdraw to TON Keeper</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
