<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>USDT Vault Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            dark: {
              900: '#0b0e14',
              800: '#151a23',
              700: '#1f2736',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0e14;
      color: #f3f4f6;
      min-height: 100vh;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .nav-item.active { color: #f59e0b; }
    .nav-item.active svg { stroke: #f59e0b; }
    .card-gradient {
      background: linear-gradient(135deg, #1f2736 0%, #151a23 100%);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
    }
    .btn-gold:active { transform: scale(0.97); }
    .btn-disabled {
      background: #374151 !important;
      color: #6b7280 !important;
      box-shadow: none !important;
      pointer-events: none;
    }
  </style>
</head>
<body class="pb-24">

  <!-- ===================== HEADER ===================== -->
  <header class="sticky top-0 z-40 bg-dark-900/90 backdrop-blur-md border-b border-gray-800 px-4 py-3">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div class="flex items-center gap-3">
        <div class="relative">
          <img id="userAvatar" src="https://via.placeholder.com/48/f59e0b/ffffff?text=U" alt="Avatar" class="w-11 h-11 rounded-full object-cover border border-amber-500/50" />
          <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-dark-900 rounded-full"></div>
        </div>
        <div>
          <h1 id="userName" class="font-semibold text-gray-100 text-sm leading-tight">Loading...</h1>
          <p id="userHandle" class="text-xs text-gray-400">@username</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span class="text-[10px] font-bold tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full">
          BEP-20
        </span>
        <button id="refreshBtn" class="w-8 h-8 flex items-center justify-center rounded-full bg-dark-800 border border-gray-700 text-amber-500 active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="max-w-lg mx-auto px-4 pt-5">

    <!-- VAULT TAB -->
    <section id="tab-vault" class="tab-content active space-y-4">
      <div class="card-gradient rounded-2xl p-5 shadow-lg relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-amber-500/10 rounded-full blur-xl"></div>
        <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">Total Balance</p>
        <div class="flex items-end gap-1.5 mt-2">
          <span id="balanceDisplay" class="text-4xl font-extrabold text-white">0.00</span>
          <span class="text-base font-bold text-amber-500 mb-1">USDT</span>
        </div>
        <div class="mt-4 pt-3 border-t border-gray-800 flex gap-2">
          <button id="historyBtn" class="w-full py-2 rounded-xl bg-dark-800 text-gray-300 text-xs font-medium border border-gray-700 hover:bg-dark-700">
            Transaction History
          </button>
        </div>
      </div>

      <div class="bg-dark-800 rounded-2xl p-5 border border-gray-800 space-y-3">
        <div class="flex justify-between items-center text-xs">
          <span class="text-gray-400">Withdrawable Balance</span>
          <span class="font-bold text-white"><span id="withdrawableDisplay">0.00</span> USDT</span>
        </div>

        <div>
          <label class="text-xs text-gray-400 mb-1 block">USDT Wallet Address (BEP20)</label>
          <input id="walletInput" type="text" placeholder="0x..." class="w-full bg-dark-900 border border-gray-700 rounded-xl px-3 py-2.5 text-xs text-gray-200 focus:outline-none focus:border-amber-500" />
        </div>

        <button id="withdrawBtn" class="w-full py-3 rounded-xl text-dark-900 font-bold text-sm btn-gold transition">
          Withdraw USDT
        </button>

        <p class="text-center text-[11px] text-gray-500">
          Minimum withdrawal: <span class="text-amber-500 font-medium">$25.00 USDT</span>
        </p>
      </div>
    </section>

    <!-- MISSION TAB -->
    <section id="tab-mission" class="tab-content space-y-4">
      <div class="bg-dark-800 rounded-xl px-4 py-3 border border-gray-800 flex justify-between items-center">
        <span class="text-xs text-gray-400">Current Balance</span>
        <span class="text-sm font-bold text-amber-400"><span id="missionBalance">0.00</span> USDT</span>
      </div>

      <div class="bg-dark-800 rounded-2xl p-4 border border-gray-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-xl">📢</div>
        <div class="flex-1">
          <h3 class="font-semibold text-white text-xs">Join Telegram Channel</h3>
          <p class="text-[11px] text-amber-400 mt-0.5">+5.00 USDT</p>
        </div>
        <button id="taskChannelBtn" onclick="doChannelTask()" class="px-3.5 py-2 rounded-xl btn-gold text-dark-900 text-xs font-bold">JOIN</button>
      </div>

      <div class="bg-dark-800 rounded-2xl p-4 border border-gray-800 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-xl">📺</div>
        <div class="flex-1">
          <h3 class="font-semibold text-white text-xs">Watch Video Task</h3>
          <p class="text-[11px] text-amber-400 mt-0.5">+3.00 USDT</p>
        </div>
        <button onclick="doTask(3)" class="px-3.5 py-2 rounded-xl btn-gold text-dark-900 text-xs font-bold">WATCH</button>
      </div>
    </section>

    <!-- REFER TAB -->
    <section id="tab-refer" class="tab-content space-y-4">
      <div class="card-gradient rounded-2xl p-5 text-center">
        <p class="text-xs font-medium text-amber-400 uppercase">Earn per referral</p>
        <p class="text-3xl font-extrabold text-white mt-1">$4.00 <span class="text-sm text-amber-500">USDT</span></p>
      </div>

      <div class="bg-dark-800 rounded-2xl p-4 border border-gray-800 space-y-3">
        <label class="text-xs text-gray-400 block">Your Referral Link</label>
        <input id="refLink" type="text" readonly class="w-full bg-dark-900 border border-gray-700 rounded-xl px-3 py-2.5 text-xs text-gray-300 truncate focus:outline-none" value="" />
        <div class="flex gap-2">
          <button id="copyBtn" class="flex-1 py-2.5 rounded-xl bg-dark-700 text-amber-400 text-xs font-semibold border border-amber-500/30">COPY</button>
          <button id="shareBtn" class="flex-1 py-2.5 rounded-xl btn-gold text-dark-900 text-xs font-bold">SHARE</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="bg-dark-800 rounded-2xl p-4 border border-gray-800 text-center">
          <p class="text-[10px] text-gray-400 uppercase">Referrals</p>
          <p id="totalRegistered" class="text-xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-dark-800 rounded-2xl p-4 border border-gray-800 text-center">
          <p class="text-[10px] text-gray-400 uppercase">Referral Earned</p>
          <p id="referralBonus" class="text-xl font-bold text-amber-400 mt-1">0.00</p>
        </div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 bg-dark-900/95 backdrop-blur-md border-t border-gray-800 z-50">
    <div class="max-w-lg mx-auto flex justify-around py-2">
      <button data-tab="vault" class="nav-item active flex flex-col items-center gap-1 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <span class="text-[10px] font-medium">Vault</span>
      </button>
      <button data-tab="mission" class="nav-item flex flex-col items-center gap-1 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 022 2h2a2 2 0 022-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span class="text-[10px] font-medium">Mission</span>
      </button>
      <button data-tab="refer" class="nav-item flex flex-col items-center gap-1 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-[10px] font-medium">Refer</span>
      </button>
    </div>
  </nav>

  <!-- TOAST -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-amber-500 text-dark-900 text-xs font-bold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    Copied!
  </div>

  <script>
    const BOT_USERNAME = 'YourBotUsername'; // আপনার টেলিগ্রাম বট ইউজারনেম (@ ছাড়া)
    const REQUIRED_CHANNEL = 'https://t.me/CryptoIncomeBD'; // চ্যানেল লিংক

    let balance = 0.00;
    const MIN_WITHDRAW = 25.00;
    let channelTaskDone = false;

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function loadUser() {
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('userName').textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '');
        document.getElementById('userHandle').textContent = user.username ? '@' + user.username : 'ID: ' + user.id;
        if (user.photo_url) document.getElementById('userAvatar').src = user.photo_url;
        document.getElementById('refLink').value = `https://t.me/${BOT_USERNAME}?start=ref_${user.id}`;
      } else {
        document.getElementById('userName').textContent = 'Demo User';
        document.getElementById('userHandle').textContent = '@demouser';
        document.getElementById('refLink').value = `https://t.me/${BOT_USERNAME}?start=ref_demo`;
      }
    }

    function updateBalances() {
      const bal = balance.toFixed(2);
      document.getElementById('balanceDisplay').textContent = bal;
      document.getElementById('withdrawableDisplay').textContent = bal;
      document.getElementById('missionBalance').textContent = bal;

      const btn = document.getElementById('withdrawBtn');
      if (balance >= MIN_WITHDRAW) {
        btn.classList.remove('btn-disabled');
        btn.classList.add('btn-gold');
        btn.disabled = false;
      } else {
        btn.classList.add('btn-disabled');
        btn.classList.remove('btn-gold');
        btn.disabled = true;
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2000);
    }

    // TAB SWITCHING
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
      });
    });

    // CHANNEL TASK VERIFICATION
    function doChannelTask() {
      if(channelTaskDone) return;
      tg.openTelegramLink(REQUIRED_CHANNEL);
      const btn = document.getElementById('taskChannelBtn');
      btn.textContent = 'VERIFYING...';
      
      setTimeout(() => {
        balance += 5.00;
        channelTaskDone = true;
        updateBalances();
        btn.textContent = 'DONE';
        btn.classList.add('btn-disabled');
        showToast('+5.00 USDT Added!');
      }, 4000);
    }

    function doTask(amount) {
      balance += amount;
      updateBalances();
      showToast(`+${amount.toFixed(2)} USDT Added!`);
    }

    // WITHDRAW
    document.getElementById('withdrawBtn').addEventListener('click', () => {
      const wallet = document.getElementById('walletInput').value.trim();
      if (!wallet) {
        showToast('Please enter your BEP20 Wallet Address');
        return;
      }
      showToast('Withdrawal Request Sent to Admin!');
      balance = 0;
      updateBalances();
      document.getElementById('walletInput').value = '';
    });

    // COPY LINK
    document.getElementById('copyBtn').addEventListener('click', () => {
      const link = document.getElementById('refLink').value;
      navigator.clipboard.writeText(link).then(() => showToast('Link Copied!'));
    });

    // INIT
    loadUser();
    updateBalances();
  </script>
</body>
</html>
